<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
   <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <meta name="description" content="مساعد الذكاء الاصطناعيمن اعداد مهداوي اشرفنموذج حقيقي للذكاء الاصطناعي">
    <meta name="keywords" content="Chatgpt , achraf ,Open AI , الذكاء الإصطناعي , ChatGPT ">
  <title>مساعد مهداوي للذكاء الاصطناعي</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: "Tahoma", sans-serif;
      background: #1e1e2f;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: linear-gradient(90deg, #4a69bd, #1e3799);
      color: #fff;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .msg {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 75%;
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
    }

    .user {
      background: #4a69bd;
      align-self: flex-end;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .bot {
      background: #2f3640;
      align-self: flex-start;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .input {
      display: flex;
      padding: 12px;
      border-top: 1px solid #444;
      background: #2c2c3c;
    }

    .input input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background: #1e1e2f;
      color: #fff;
    }

    .input button {
      margin-left: 8px;
      padding: 12px 18px;
      border: none;
      background: #4a69bd;
      color: #fff;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .input button:hover {
      background: #1e3799;
    }

    footer {
      text-align: center;
      padding: 10px;
      background: #111;
      font-size: 14px;
      border-top: 1px solid #333;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>🤖 مساعد مهداوي للذكاء الاصطناعي</header>
  
  <div class="chat" id="chat"></div>
  
  <div class="input">
    <input id="userInput" type="text" placeholder="اكتب سؤالك هنا...">
    <button onclick="sendMessage()">إرسال</button>
  </div>

  <footer>جميع الحقوق محفوظة © مهداوي 2025</footer>

  <script>
    const chat = document.getElementById("chat");

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = "msg " + sender;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";

      const loading = document.createElement("div");
      loading.className = "msg bot";
      loading.innerText = "⏳ جاري التفكير...";
      chat.appendChild(loading);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer 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"
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [{ role: "user", content: text }]
          })
        });

        const data = await res.json();
        loading.innerText = data.choices[0].message.content;

      } catch (err) {
        loading.innerText = "❌ خطأ في الاتصال بالذكاء الاصطناعي.";
      }
    }
  </script>
</body>
</html>
